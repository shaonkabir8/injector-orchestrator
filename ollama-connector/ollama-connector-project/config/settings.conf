# Ollama Connector — Configuration
# Edit this file to customize your agentic loop settings.

# Model configuration
OLLAMA_MODEL_DEFAULT="qwen2.5:7b"
OLLAMA_MODEL_FALLBACK="deepseek-r1:8b"

# IDE integration
CURSOR_AUTO_START="true"

# Logging
LOG_LEVEL="INFO"        # DEBUG | INFO | WARN | ERROR
THEME="dark"

# Metrics
AUTO_METRICS="true"
METRICS_INTERVAL="5"   # seconds between metric snapshots

# Loop settings
MAX_ITERATIONS="50"
OOM_THRESHOLD="85"      # RAM % threshold before OOM guard triggers

# Git auto-commit
GIT_AUTO_COMMIT="true"
GIT_TARGET_DIR="./src"

# Notifications
ENABLE_NOTIFICATIONS="true"
